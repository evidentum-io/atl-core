[package]
name = "atl-core"
version = "0.30.0"
edition = "2021"
rust-version = "1.92.0"
authors = ["Dmitrii Zatona <dmitrii@zatona.dev>"]
license = "Apache-2.0"
description = "Pure cryptographic library for ATL Protocol v2.0 (Anchored Transparency Log)"
repository = "https://github.com/evidentum-io/atl-core"
homepage = "https://atl-protocol.org"
documentation = "https://atl-protocol.org/implementations/atl-core"
readme = "README.md"
keywords = ["transparency-log", "merkle-tree", "cryptography", "verification"]
categories = ["cryptography", "data-structures"]

[dependencies]
# Core cryptographic dependencies (always required)
sha2 = { version = "0.10", features = ["oid"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` is protocol-relevant, not a tuning knob. ATL hashes entry
# metadata as SHA-256(JCS(metadata)), so the double a JSON number literal
# parses to is part of the hash preimage. serde_json's default number parser
# is a best-effort f64 fast path that lands one ULP away from the correctly
# rounded value for roughly 30% of arbitrary doubles -- including the RFC 8785
# Section 3.2.2 worked example, `333333333.33333329`. `float_roundtrip` selects
# the correctly rounded parser, which is what RFC 8785 Section 3.2.2.3 requires
# by building on IEEE 754 double precision. The floor is the version this was
# verified against; the feature itself is much older.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
# ECMA-262 Section 7.1.12.1 `Number::toString`, which RFC 8785 Section 3.2.2.3
# mandates verbatim ("including the Note 2 enhancement"). Rust's own `f64`
# Display is *not* that algorithm: it never switches to exponential notation
# and it breaks shortest-digit ties away from zero rather than to even. Both
# are protocol-visible differences, so the number formatter is pinned to a
# crate whose documented contract is the ECMAScript algorithm rather than to
# a std formatter that only promises round-tripping.
ryu-js = "1"
uuid = { version = "1", features = ["serde"] }
thiserror = "1"
hex = "0.4"
base64 = "0.22"
subtle = "2"

# Optional cryptographic dependencies
#
# RFC 3161 / CMS / X.509 verification stack (pure Rust, RustCrypto `formats`
# and `signatures` ecosystems -- no OpenSSL FFI, compatible with
# `unsafe_code = "forbid"`). Pinned to the last stable (non-RC) release line
# across the whole ecosystem so `der`/`spki`/`x509-cert` types are literally
# the same types everywhere (no cross-version `Any`/`ObjectIdentifier`
# conversions needed).
x509-tsp = { version = "0.1", optional = true }
cms = { version = "0.2", optional = true }
x509-cert = { version = "0.2", optional = true }
der = { version = "0.7", optional = true }
spki = { version = "0.7", optional = true }
const-oid = { version = "0.9", features = ["db"], optional = true }
rsa = { version = "0.9", default-features = false, features = ["std", "pkcs5", "sha2"], optional = true }
sha1 = { version = "0.10", features = ["oid"], optional = true }
ecdsa = { version = "0.16", features = ["der", "pkcs8"], optional = true }
p384 = { version = "0.13", features = ["ecdsa", "pkcs8"], optional = true }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"], optional = true }
signature = { version = "2", optional = true }

bitcoin_hashes = { version = "0.14", optional = true }

[dev-dependencies]
hex = "0.4"
proptest = "1"
criterion = "0.5"
# Parses `src/core/receipt.rs` in `tests/lib_exports_tests.rs` to enforce an
# invariant the type system cannot express: no method on `Receipt` may take a
# receiver and return a `Receipt`. The predecessor of that check was a
# line-by-line text scan, which `rustfmt` defeats on any signature long enough
# to be split across lines, and which never looked at trait impls at all. Real
# syntax rather than guessing at strings. Dev-only: it is not in the dependency
# graph of anything that links `atl-core`.
syn = { version = "2", default-features = false, features = ["full", "parsing", "visit"] }

[features]
default = ["rfc3161-verify", "bitcoin-ots"]
rfc3161-verify = [
    "dep:x509-tsp",
    "dep:cms",
    "dep:x509-cert",
    "dep:der",
    "dep:spki",
    "dep:const-oid",
    "dep:rsa",
    "dep:sha1",
    "dep:ecdsa",
    "dep:p384",
    "dep:p256",
    "dep:signature",
]
bitcoin-ots = ["dep:bitcoin_hashes"]

# Audit-only. Turns on `serde_json/arbitrary_precision` so the test suite can be
# run in the configuration a consumer can impose on this crate without asking:
# Cargo unifies features across the whole graph, so any crate anywhere in a
# dependent's tree that wants arbitrary precision switches it on here too.
#
# In that mode `serde_json` represents numbers as a map keyed by the private
# token `$serde_json::private::Number`, and `Number::as_f64` re-parses the
# stored text instead of returning a stored double. Both are protocol-visible:
# the first breaks any hand-written `Deserialize` for `Value` (which is why this
# crate has none), and the second is what `jcs::format_number` stands on.
#
# `tests/arbitrary_precision_audit.rs` pins canonical forms and `metadata_hash`
# values as literal constants, so running the suite with and without this
# feature proves byte-identity rather than merely self-consistency. Never enable
# it for a real build; it is not a supported configuration knob.
arbitrary-precision-audit = ["serde_json/arbitrary_precision"]

[[bench]]
name = "merkle_bench"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
# pedantic and nursery are intentionally NOT enabled here: nursery lints are
# unstable by design and change every rustc release, which would make this
# blocking lint set break CI regardless of code quality. They are still run
# in CI as a separate informational step (see .github/workflows/ci.yml),
# just not via this warn-level Cargo.toml gate.
all = "warn"
cargo = "warn"
