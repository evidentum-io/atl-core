[package]
name = "atl-core"
version = "0.23.2"
edition = "2021"
rust-version = "1.92.0"
authors = ["Dmitrii Zatona <dmitrii@zatona.dev>"]
license = "Apache-2.0"
description = "Pure cryptographic library for ATL Protocol v2.0 (Anchored Transparency Log)"
repository = "https://github.com/evidentum-io/atl-core"
homepage = "https://atl-protocol.org"
documentation = "https://atl-protocol.org/implementations/atl-core"
readme = "README.md"
keywords = ["transparency-log", "merkle-tree", "cryptography", "verification"]
categories = ["cryptography", "data-structures"]

[dependencies]
# Core cryptographic dependencies (always required)
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
thiserror = "1"
hex = "0.4"
base64 = "0.22"
subtle = "2"

# Optional cryptographic dependencies
cryptographic-message-syntax = { version = "0.27", optional = true }
bcder = { version = "0.7", optional = true }
bitcoin_hashes = { version = "0.14", optional = true }

[dev-dependencies]
proptest = "1"
criterion = "0.5"

[features]
default = ["rfc3161-verify", "bitcoin-ots"]
rfc3161-verify = ["dep:cryptographic-message-syntax", "dep:bcder"]
bitcoin-ots = ["dep:bitcoin_hashes"]

[[bench]]
name = "merkle_bench"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
# pedantic and nursery are intentionally NOT enabled here: nursery lints are
# unstable by design and change every rustc release, which would make this
# blocking lint set break CI regardless of code quality. They are still run
# in CI as a separate informational step (see .github/workflows/ci.yml),
# just not via this warn-level Cargo.toml gate.
all = "warn"
cargo = "warn"
