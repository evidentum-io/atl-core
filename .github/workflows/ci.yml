name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (blocking)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (pedantic + nursery, informational)
        continue-on-error: true
        run: cargo clippy --all-targets -- -W clippy::pedantic -W clippy::nursery -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --all-features --fail-under-lines 90

  msrv:
    name: MSRV (1.92.0)
    runs-on: ubuntu-latest
    # rust-toolchain.toml in this repo resolves to stable and, per rustup's
    # precedence, overrides `rustup default` (which is all dtolnay/rust-toolchain
    # sets). RUSTUP_TOOLCHAIN outranks the toolchain file, so it is the only way
    # to make this job actually run under 1.92.0 instead of silently building
    # against stable.
    env:
      RUSTUP_TOOLCHAIN: "1.92.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check
